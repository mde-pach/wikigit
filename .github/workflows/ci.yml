name: CI

# Clean-clone verification: a fresh checkout must install, lint, test, and build
# for both the app and the Worker. Catches dependency drift (e.g. a package
# declared but not installed) and any broken test/build before merge.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install app deps
        run: bun install --frozen-lockfile

      # Before the app tests: the root vitest run also covers worker/ tests,
      # which import the worker's own dependencies.
      - name: Install worker deps
        run: bun install --frozen-lockfile
        working-directory: worker

      - name: Lint + format check
        run: bun run lint

      - name: App tests
        run: bun run test

      - name: App build
        run: bun run build

      - name: Worker verify (typecheck + tests)
        run: bun run verify
        working-directory: worker

  # Reader behaviour in a real browser against the wikigit.org-shaped build:
  # nothing shifts while pages load, and return visits reuse the sha cache.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install app deps
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Browser tests
        run: bun run test:e2e
